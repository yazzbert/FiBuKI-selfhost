name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # 'deploy/**' matches ci.yml. Without it the Self-host deployment lane
    # gets no CodeQL at all, and work replayed from the retired branch can
    # reintroduce a fixed alert on a green pull request — storage-routes.ts
    # and js/remote-property-injection #283 being the live example.
    branches: [main, 'deploy/**']
  schedule:
    - cron: "0 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended only: security-and-quality added ~166 quality-only
          # alerts (unused locals etc.) on ported code with zero security value.
          # security-extended keeps every security query plus the extended set.
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
