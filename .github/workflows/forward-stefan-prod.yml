# Keeps stefan-prod current: merges upstream main and every open feat/*
# branch into stefan-prod once a day. A merge conflict fails the job loudly;
# resolve it locally and push. One job on purpose - Actions bill per job.
# Asked for by upstream (fork issue #49): stefan-prod is merge-only, never
# the source of a PR.
name: forward-to-stefan-prod

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stefan-prod
          fetch-depth: 0

      - name: Merge upstream main and open feat branches
        run: |
          set -euo pipefail
          git config user.name "stefan-prod forwarder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/felixtosh/FiBuKI.git
          git fetch upstream main
          git fetch origin
          git merge --no-edit upstream/main
          for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/feat/); do
            if ! git merge --no-edit "$b"; then
              git merge --abort
              echo "::warning::skipped $b - conflicts; already carried on stefan-prod or needs manual merge"
            fi
          done
          git push origin stefan-prod
